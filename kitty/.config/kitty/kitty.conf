# ═══════════════════════════════════════════════════════════════
#  Dark Medieval Keep — o terminal do torreão
#  Paleta canônica: quickshell/.config/quickshell/keep/Theme.qml
# ═══════════════════════════════════════════════════════════════

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Pedra e pergaminho ──

# ── Abas ──

# ── Cores normais ──

# ── Cores vivas ──
# Estavam indefinidas e herdavam o default do kitty, que rompia o
# tema em qualquer programa que usasse bright (ls, git, TUIs).

confirm_os_window_close 0

# O default é 10 ms, ou seja o kitty acorda até 100x/s enquanto há
# saída rolando. A tela é 4K@60: abaixo de ~16 ms não há quadro novo
# para mostrar, só trabalho de composição jogado fora.
repaint_delay 16

# ── A paleta ───────────────────────────────────────────────────
# GERADA a partir do Theme.qml por tools/theme-sync.py. O terminal e a
# muralha precisam concordar sobre o que e ouro, e ate agora
# concordavam por disciplina — o que e outro nome para "ate a primeira
# vez que alguem esquecer".
#
#     tools/theme-sync.py            confere
#     tools/theme-sync.py --write    regenera
include paleta.conf
