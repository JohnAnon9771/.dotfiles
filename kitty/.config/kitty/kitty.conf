# ═══════════════════════════════════════════════════════════════
#  Dark Medieval Keep — o terminal do torreão
#  Paleta canônica: quickshell/.config/quickshell/keep/Theme.qml
# ═══════════════════════════════════════════════════════════════

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Pedra e pergaminho ──
background            #15120f
foreground            #f4f0e6

selection_background  #26333a
selection_foreground  #f4f0e6

cursor                #c2a35a
cursor_text_color     #15120f

url_color             #1e9fb4

# ── Abas ──
tab_bar_background       #11100d
active_tab_foreground    #15120f
active_tab_background    #c2a35a
inactive_tab_foreground  #b0a79b
inactive_tab_background  #1b1813

# ── Cores normais ──
color0  #15120f
color1  #b04b4b
color2  #4f6b4a
color3  #c2a35a
color4  #1e6a88
color5  #8b6f9b
color6  #3a8f8f
color7  #dcd4c4

# ── Cores vivas ──
# Estavam indefinidas e herdavam o default do kitty, que rompia o
# tema em qualquer programa que usasse bright (ls, git, TUIs).
color8  #6f6559
color9  #c9743a
color10 #86b39a
color11 #e1c97a
color12 #1e9fb4
color13 #a98bb8
color14 #5fb3b3
color15 #f4f0e6

confirm_os_window_close 0

# O default é 10 ms, ou seja o kitty acorda até 100x/s enquanto há
# saída rolando. A tela é 4K@60: abaixo de ~16 ms não há quadro novo
# para mostrar, só trabalho de composição jogado fora.
repaint_delay 16
