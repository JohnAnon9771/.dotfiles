# GERADO por tools/theme-sync.py a partir do Theme.qml. NAO EDITE.

format = """
[ archlinux](bold #6d6a63) $directory$git_branch$git_status$rust$ruby$nodejs$golang$package$docker_context$time
$character"""

add_newline = false

# Tetos de tempo por prompt. Sem eles o starship usa 500 ms por
# comando e 30 ms de varredura: um repositório grande, ou um `node -v`
# lento, seguram o prompt inteiro. 100 ms é mais do que suficiente
# para todo detector daqui, e o que estourar simplesmente não aparece.
command_timeout = 100
scan_timeout = 10

[directory]
style = "bold #b1a996"
read_only = "󰌾 "
truncation_length = 3
truncation_symbol = "../"
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bold #6d6a63"
format = "[$symbol$branch]($style) "

# Sujo é atenção, e brasa é a cor da atenção na escala de estado.
[git_status]
style = "bold #a06237"
format = '([$all_status$ahead_behind]($style) )'
# $all_status obriga um `git status` completo a cada prompt. Pular os
# submódulos é o corte que a própria doc do starship recomenda.
ignore_submodules = true

[rust]
symbol = " "
style = "bold #44423d"
format = "[$symbol($version )]($style)"

[ruby]
symbol = " "
style = "bold #44423d"
format = "[$symbol($version )]($style)"

[nodejs]
symbol = " "
style = "bold #44423d"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #44423d"
format = "[$symbol($version )]($style)"

# Era um emoji colorido de caixa de papelão, que quebra a voz
# única e não tem cor nenhuma da paleta.
[package]
symbol = "󰏖 "
style = "bold #44423d"
format = "[$symbol$version]($style) "

[time]
disabled = false
time_format = "%R"
style = "#6d6a63"
format = '[$time]($style) '

# O ÚNICO OURO DA LINHA. Onde você digita é o que está ativo.
[character]
success_symbol = "[❯](bold #c9a24a)"
error_symbol = "[❯](bold #9f6460)"
vicmd_symbol = "[❮](bold #6d6a63)"
