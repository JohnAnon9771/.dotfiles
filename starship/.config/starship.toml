format = """
[ archlinux](bold #1e6a88) $directory$git_branch$git_status$rust$ruby$nodejs$golang$package$docker_context$time
$character"""

add_newline = false

# Tetos de tempo por prompt. Sem eles o starship usa 500 ms por
# comando e 30 ms de varredura: um repositório grande, ou um `node -v`
# lento, seguram o prompt inteiro. 100 ms é mais do que suficiente
# para todo detector daqui, e o que estourar simplesmente não aparece.
command_timeout = 100
scan_timeout = 10

# Directory: Clean blue/cyan
[directory]
style = "bold #3a8f8f"
read_only = " "
truncation_length = 3
truncation_symbol = "../"
format = "[$path]($style) "

# Git: Minimalist purple
[git_branch]
symbol = " "
style = "bold #8b6f9b"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #b04b4b"
format = '([$all_status$ahead_behind]($style) )'
# $all_status obriga um `git status` completo a cada prompt. Pular os
# submódulos é o corte que a própria doc do starship recomenda.
ignore_submodules = true

# Rust: Official Rust Orange/Red (#ce412b)
[rust]
symbol = " "
style = "bold #ce412b"
format = "[$symbol($version )]($style)"

# Ruby: Official Ruby Red (#CC342D)
[ruby]
symbol = " "
style = "bold #CC342D"
format = "[$symbol($version )]($style)"

# Node: Standard Green
[nodejs]
symbol = " "
style = "bold #4f6b4a"
format = "[$symbol($version )]($style)"

# Go: Cyan
[golang]
symbol = " "
style = "bold #3a8f8f"
format = "[$symbol($version )]($style)"

# Package version (shows up if reading package.json/Cargo.toml)
[package]
symbol = "📦 "
style = "bold #c2a35a"
format = "[$symbol$version]($style) "

# Time: Dimmed yellow, discreet
[time]
disabled = false
time_format = "%R"
style = "#c2a35a"
format = '[$time]($style) '

# Character: The "Arch Arch" (Arch Blue Arrow)
[character]
success_symbol = "[❯](bold #1e6a88)"
error_symbol = "[❯](bold #b04b4b)"
vicmd_symbol = "[❮](bold #4f6b4a)"
