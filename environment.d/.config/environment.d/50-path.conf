# O PATH da sessão gráfica.
#
# O uwsm arranca do login no tty1, e ali o PATH é só /usr/local/bin e
# /usr/bin: nem o /etc/profile do Arch nem o ~/.bash_profile desta
# máquina acrescentam o ~/.local/bin. Dá para conferir o que a sessão
# recebeu em /run/user/$UID/uwsm/env_pre.
#
# Sem esta linha, keep-shot, keep-session, gamer-vt e gamer-mode
# existem no disco e mesmo assim não são encontrados — o bind dispara,
# o dispatcher roda, o exec não acha o binário e falha calado, sem uma
# linha no log.
#
# Quem lê este arquivo é o systemd do usuário, que sobe as duas pontas
# que precisam dos scripts: wayland-wm@hyprland-uwsm.desktop.service,
# o compositor, e quickshell-keep.service, o torreão. Uma linha cobre
# as duas.
#
# Vale a partir do próximo login: o gerador roda quando o gerenciador
# de usuário arranca, e não relê sozinho depois.

PATH=${HOME}/.local/bin:${PATH}
